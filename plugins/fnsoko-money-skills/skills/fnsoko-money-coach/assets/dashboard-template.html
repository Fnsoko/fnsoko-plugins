<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<!--
  Fnsoko Money Dashboard template.
  HOW TO FILL IT: replace everything between the two FNSOKO-DATA markers below with
  {"name": "<first name or empty>", "made": "YYYY-MM-DD", "insights": <the JSON from `fnsoko_tools.py insights`>}
  Change nothing else. Every number on the page comes from that JSON.
-->
<style>
/* Layout: summary first (status chips, 4 tiles), then spending vs plan, where it goes, worth a look, what-if.
   Brand = the planner: Alegreya Sans, dark-teal ink, Pacific-blue headers, lime strip.
   Chart colours validated (dataviz validator, light on #FFFFFF and dark on #0E2228):
   Needs coral / Wants lime / Future teal / Debt purple, and a 5-slot order for "what you own"
   (teal, gold, purple, coral, lime). Lime and gold sit under 3:1 on white, so they always carry visible labels. */
:root {
  --ink: #1B434D; --ink-2: #4E666B; --ink-3: #6E8386;
  --bg: #FFFFFF; --panel: #F6FAFA; --rule: #D3DFE1; --head: #00A1AE; --on-head: #FFFFFF; --lime: #AED12F;
  --bar: #00A1AE; --track: #E6EEEF; --plan: #1B434D;
  --needs: #E15D7A; --wants: #A3C232; --future: #00A1AE; --debt: #8E5BB5; --gold: #E5A800;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --font: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  --gap: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #DCEEF0; --ink-2: #A9C0C4; --ink-3: #8AA3A7; --bg: #0E2228; --panel: #132C33; --rule: #284950;
  --head: #0C949F; --on-head: #FFFFFF; --lime: #B9DB45; --bar: #18AAB6; --track: #1D3B42; --plan: #DCEEF0;
  --needs: #DE6680; --wants: #83A01F; --future: #0C949F; --debt: #A070E0; --gold: #BF8A14; color-scheme: dark } }
:root[data-theme="dark"] {
  --ink: #DCEEF0; --ink-2: #A9C0C4; --ink-3: #8AA3A7; --bg: #0E2228; --panel: #132C33; --rule: #284950;
  --head: #0C949F; --on-head: #FFFFFF; --lime: #B9DB45; --bar: #18AAB6; --track: #1D3B42; --plan: #DCEEF0;
  --needs: #DE6680; --wants: #83A01F; --future: #0C949F; --debt: #A070E0; --gold: #BF8A14; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35; margin: 0; }
.page { max-width: 1080px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: var(--gap); }
.brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--head); }
h1 { margin: 2px 0 0; font-size: clamp(26px, 4vw, 36px); font-weight: 800; line-height: 1.05; text-wrap: balance; }
.strip { height: 6px; background: linear-gradient(90deg, var(--future) 0 33%, var(--lime) 33% 66%, var(--needs) 66%); margin-top: 10px; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1.5px solid var(--rule); border-radius: 999px; font-size: 14px; font-weight: 700; }
.chip i { font-style: normal; width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip small { font-weight: 400; color: var(--ink-2); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
.tile { --acc: var(--future); background: color-mix(in srgb, var(--acc) 9%, var(--bg)); border-top: 5px solid var(--acc); border-radius: 0 0 8px 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile:nth-child(4n+2) { --acc: var(--needs); } .tile:nth-child(4n+3) { --acc: var(--wants); } .tile:nth-child(4n+4) { --acc: var(--debt); }
.tile .k { font-size: 14px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.tile .k .em { font-size: 18px; width: 30px; height: 30px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--acc) 22%, var(--bg)); }
.tile .v { font-size: clamp(24px, 3.2vw, 32px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .s { font-size: 13.5px; color: var(--ink-2); }

.grid2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: stretch; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--gap); align-items: stretch; }
.card { border: 1.5px solid var(--rule); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card > h2 { margin: 0; background: var(--head); color: var(--on-head); font-size: 16px; font-weight: 800; padding: 8px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card > h2 small { font-weight: 500; font-size: 13.5px; opacity: .95; }
.body { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.note { margin: 0; font-size: 13.5px; color: var(--ink-2); font-style: italic; }

/* spending vs plan: one bar per category, plan as a tick */
.rows { display: flex; flex-direction: column; gap: 9px; }
.row { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.row .name { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 7.5em; }
.track { position: relative; height: 14px; background: var(--track); border-radius: 0 4px 4px 0; cursor: default; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.ahead { position: absolute; top: 3px; bottom: 3px; background: var(--bar); opacity: .35; border-radius: 0 4px 4px 0; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--plan); }
.flag { color: var(--bad); font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; display: inline-block; border-radius: 2px; }
.paceline { display: grid; gap: 4px; font-size: 14px; }

/* where it goes: 100% stacked bars, one per month */
.stack { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px; align-items: center; }
.bar100 { display: flex; height: 22px; gap: 2px; }
.bar100 > span { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; min-width: 0; overflow: hidden; }
.bar100 > span:last-child { border-radius: 0 4px 4px 0; }
.bar100 .w, .bar100 .n { color: #1B434D; }
.guide { font-size: 13px; color: var(--ink-2); }
details { font-size: 14px; } summary { cursor: pointer; font-weight: 700; color: var(--head); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 700; border-bottom: 1.5px solid var(--rule); padding: 4px 6px; }
td { border-bottom: 1px solid var(--rule); padding: 4px 6px; }

/* worth a look */
.looks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.looks li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--rule); }
.looks li:first-child { border-top: 0; padding-top: 0; }
.looks li { grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
.looks .ic { font-size: 18px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--gold) 18%, var(--bg)); }
.looks li:nth-child(3n+2) .ic { background: color-mix(in srgb, var(--needs) 16%, var(--bg)); }
.looks li:nth-child(3n+3) .ic { background: color-mix(in srgb, var(--future) 16%, var(--bg)); }
/* donut + legend */
.donutwrap { display: grid; grid-template-columns: minmax(150px, 200px) minmax(0, 1fr); gap: 16px; align-items: center; }
.donut { width: 100%; height: auto; display: block; }
.donut circle.seg { cursor: default; }
.donut .c1 { fill: var(--ink); font-size: 22px; font-weight: 800; }
.donut .c2 { fill: var(--ink-2); font-size: 12px; }
.dleg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.dleg li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dleg i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.dleg b { font-variant-numeric: tabular-nums; }
.dleg small { color: var(--ink-2); font-size: 13px; }
.subhead { margin: 6px 0 0; font-size: 14px; font-weight: 800; color: var(--ink-2); }
@media (max-width: 460px) { .donutwrap { grid-template-columns: minmax(0, 1fr); } .donut { max-width: 220px; margin: 0 auto; } }
.looks b { font-weight: 800; }
.looks p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }

/* what-if */
.whatif label { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.whatif output { font-size: 22px; font-weight: 800; color: var(--head); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--head); height: 28px; }
input[type=range]:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }
.better { color: var(--good); font-weight: 800; }

footer { font-size: 13px; color: var(--ink-3); font-style: italic; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; border-top: 1.5px solid var(--rule); padding-top: 10px; }
/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--head); scrollbar-width: thin; }
.tabs a, .card > h2, .goal h3 { word-spacing: 1.5px; }
.tabs a { flex: none; padding: 8px 12px; font-weight: 700; font-size: 15px; color: var(--ink-2); text-decoration: none; border: 1.5px solid transparent; border-bottom: 0; }
.tabs a[aria-current="page"] { background: var(--head); color: var(--on-head); }
.tabs a:hover { color: var(--ink); } .tabs a[aria-current="page"]:hover { color: var(--on-head); }
.tabs a:focus-visible { outline: 2px solid var(--head); outline-offset: -2px; }
.view { display: flex; flex-direction: column; gap: var(--gap); }
.empty { border: 1.5px dashed var(--rule); padding: 18px; color: var(--ink-2); }
.empty b { color: var(--ink); }
/* progress */
.prog { position: relative; height: 18px; background: var(--track); border-radius: 0 4px 4px 0; }
.prog > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.prog .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--plan); }
.marks { position: relative; height: 16px; font-size: 12px; color: var(--ink-2); }
.marks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
/* column chart */
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; align-items: end; height: 170px; border-bottom: 1.5px solid var(--rule); padding-top: 8px; }
.colgrp { display: flex; gap: 2px; align-items: end; height: 100%; justify-content: center; }
.colgrp > span { width: min(22px, 40%); border-radius: 4px 4px 0 0; min-height: 2px; }
.collabels { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; font-size: 13px; color: var(--ink-2); text-align: center; }
.coltarget { position: relative; }
.coltarget .tline { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--plan); }
.coltarget .tline span { position: absolute; right: 0; top: -18px; font-size: 12px; color: var(--ink-2); background: var(--bg); padding: 0 4px; }
/* goals */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: var(--gap); }
.goal { border: 1.5px solid var(--rule); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.goal .top { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; }
.goal .donut .c1 { font-size: 34px; } .goal .donut .c2 { font-size: 20px; }
.goal h3 { margin: 0; font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }
.goal .status { font-size: 13.5px; font-weight: 700; }
.goal dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
.goal dt { color: var(--ink-2); } .goal dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
/* inputs */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; }
.fields input, .seg button { font: inherit; font-size: 15px; padding: 7px 9px; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 4px; }
.fields input:focus-visible, .seg button:focus-visible { outline: 2px solid var(--head); outline-offset: 1px; }
.seg { display: inline-flex; gap: 0; } .seg button { cursor: pointer; border-radius: 0; } .seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--head); color: var(--on-head); border-color: var(--head); }
svg text { fill: var(--ink-2); font-family: var(--font); font-size: 12px; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 8px; border-radius: 4px; max-width: 240px; z-index: 5; }

@media (max-width: 860px) { .grid2, .grid2b { grid-template-columns: minmax(0, 1fr); } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .track { grid-column: 1 / -1; grid-row: 2; } }
@media (prefers-reduced-motion: no-preference) { .fill, .bar100 > span { transition: width .4s ease; } }
</style>

<!-- FNSOKO-DATA:START -->
<script type="application/json" id="fnsoko-data">{"name": "", "made": "", "insights": {"ok": false, "message": "No data yet. Ask Claude: make my money dashboard."}}</script>
<!-- FNSOKO-DATA:END -->

<main class="page" id="app">
  <header>
    <p class="brand">Fnsoko Money Planner</p>
    <h1 id="title">My money dashboard</h1>
    <div class="strip" aria-hidden="true"></div>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Dashboards">
    <a href="#money">📅 This month</a><a href="#debt">⛓️ Debt-free</a><a href="#fund">🛟 Emergency fund</a><a href="#goals">🎯 Goals</a><a href="#year">📆 My year</a><a href="#worth">🏡 Net worth</a><a href="#future">🌅 My future</a>
  </nav>
  <div class="view" id="view-money">
  <section class="tiles" id="tiles" aria-label="This month in numbers"></section>
  <section class="grid2">
    <div class="card"><h2>📊 Spending against your plan <small id="paceSmall"></small></h2><div class="body" id="spend"></div></div>
    <div class="card"><h2>👀 Worth a look</h2><div class="body"><ul class="looks" id="looks"></ul></div></div>
  </section>
  <section class="grid2">
    <div class="card"><h2>🍩 Where your money goes</h2><div class="body" id="split"></div></div>
    <div class="card whatif"><h2>🔀 What if I moved some money?</h2><div class="body" id="whatif"></div></div>
  </section>
  </div>
  <div class="view" id="view-debt" hidden></div>
  <div class="view" id="view-fund" hidden></div>
  <div class="view" id="view-goals" hidden></div>
  <div class="view" id="view-year" hidden></div>
  <div class="view" id="view-worth" hidden></div>
  <div class="view" id="view-future" hidden></div>
  <footer id="foot"></footer>
</main>
<div id="tip" hidden></div>

<script>
(function () {
  var raw = {};
  try { raw = JSON.parse(document.getElementById('fnsoko-data').textContent); } catch (e) { raw = {}; }
  var D = raw.insights || {};
  var app = document.getElementById('app');
  if (!D.ok) { app.querySelector('#tiles').innerHTML = '<p class="note">' + esc(D.message || 'No data yet.') + '</p>'; return; }
  var CUR = D.currency || '';
  var STEPS = ['Know my numbers', 'Starter buffer', 'Clear expensive debt', 'Full emergency fund', 'Live on 50/30/20', 'Goals on track', 'Retirement on track'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function money(n) { return (CUR ? CUR + ' ' : '') + Math.round(n || 0).toLocaleString('en-KE'); }
  function pct(x) { return x == null ? '–' : Math.round(x * 100) + '%'; }
  function monthName(k) { var p = String(k).split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function short(k) { var p = String(k).split('-'); return MONTHS[+p[1] - 1].slice(0, 3); }

  // header
  var name = (raw.name || '').trim();
  document.getElementById('title').textContent = (name ? name + "'s money" : 'My money') + ': ' + monthName(D.month);
  var cov = D.coverage || {};
  var covColor = cov.label === 'VERIFIED' ? 'var(--good)' : (cov.label === 'PROVISIONAL' ? 'var(--warn)' : 'var(--ink-3)');
  var covIcon = cov.label === 'VERIFIED' ? '✓' : (cov.label === 'PROVISIONAL' ? '!' : '~');
  var covText = cov.label === 'PROVISIONAL' && cov.share_logged != null ? 'about ' + pct(cov.share_logged) + ' logged' :
    (cov.label === 'VERIFIED' ? 'it adds up' : 'no month-end balances yet');
  var step = (D.investing || {}).ladder_step;
  var chips = '<span class="chip"><i style="background:' + covColor + '"></i>' + covIcon + ' ' + esc(cov.label || 'ESTIMATED') + ' <small>' + esc(covText) + '</small></span>';
  if (step) chips += '<span class="chip"><i style="background:var(--lime)"></i>Step ' + Math.min(step, 7) + ' of 7 <small>' + esc(STEPS[Math.min(step, 7) - 1]) + '</small></span>';
  if (D.in_progress) chips += '<span class="chip"><i style="background:var(--head)"></i>Day ' + D.day_of_month + ' of ' + D.days_in_month + ' <small>month in progress</small></span>';
  document.getElementById('chips').innerHTML = chips;

  // tiles
  var T = D.totals || {}, H = D.health || {}, full = (H.months || []).filter(function (m) { return m.savings_rate != null; });
  var last = full.length ? full[full.length - 1] : null;
  var sr = D.in_progress ? (last ? last.savings_rate : null) : (T['in'] ? T.Future / T['in'] : null);
  var srNote = D.in_progress ? (last ? 'last full month (' + short(last.month) + '). Guide: 20%+' : 'Guide: 20% or more') : 'Guide: 20% or more';
  var em = H.emergency_months;
  var tiles = [
    ['Money in', money(T['in']), D.in_progress ? 'so far this month' : 'this month', '💰'],
    ['Money out', money(T.out), 'spending ' + money(T.spending) + ' · fees ' + money(T.fees), '💸'],
    ['Saved', pct(sr), srNote, '🌱'],
    ['Emergency fund', em == null ? '–' : em.toFixed(1) + ' months', 'of essentials. Guide: 3 to 6', '🛟']
  ];
  document.getElementById('tiles').innerHTML = tiles.map(function (t) { return tile(t[0], t[1], t[2], t[3]); }).join('');

  // donut: segs = [{label, value, color, tip}], centre text c1/c2. 2px surface gaps between segments.
  function donut(segs, c1, c2, aria) {
    var tot = segs.reduce(function (a, s) { return a + Math.max(0, s.value); }, 0) || 1, R = 70, SW = 30, C = 2 * Math.PI * R, off = 0;
    var gap = segs.filter(function (s) { return s.value > 0; }).length > 1 ? 2.5 : 0;
    var arcs = segs.filter(function (s) { return s.value > 0; }).map(function (s) {
      var len = s.value / tot * C, d = Math.max(0.5, len - gap);
      var el = '<circle class="seg" cx="100" cy="100" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="' + SW + '" stroke-dasharray="' + d + ' ' + (C - d) + '" stroke-dashoffset="' + (-off) + '" data-tip="' + esc(s.tip || (s.label + ': ' + money(s.value))) + '"/>';
      off += len; return el;
    }).join('');
    return '<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="' + esc(aria || '') + '"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="' + R + '" fill="none" stroke="var(--track)" stroke-width="' + SW + '"/>' + arcs + '</g>' +
      '<text class="c1" x="100" y="' + (c2 ? 100 : 108) + '" text-anchor="middle">' + esc(c1 || '') + '</text>' + (c2 ? '<text class="c2" x="100" y="120" text-anchor="middle">' + esc(c2) + '</text>' : '') + '</svg>';
  }
  function dlegend(segs, total) {
    return '<ul class="dleg">' + segs.filter(function (s) { return s.value > 0; }).map(function (s) {
      return '<li><i style="background:' + s.color + '"></i><span>' + esc(s.label) + (s.note ? ' <small>' + esc(s.note) + '</small>' : '') + '</span><b>' + money(s.value) + (total ? ' <small>' + pct(s.value / total) + '</small>' : '') + '</b></li>';

    var prog = '<div class="prog" data-tip="' + esc(money(f.balance) + ' of ' + money(f.target)) + '"><span style="width:' + (share * 100) + '%"></span>' +
      marks.map(function (m) { return '<i class="mark" style="left:calc(' + (m / mt * 100) + '% - 1px)"></i>'; }).join('') + '</div>' +
      '<div class="marks">' + marks.map(function (m) { return '<span style="left:' + (m / mt * 100) + '%">' + m + (m === 1 ? ' month' : ' months') + '</span>'; }).join('') + '</div>' +
      '<p class="note">1 month is your starter buffer (Ladder step 2). ' + mt + ' months is a full fund (step 4).</p>';
    var s = f.series || [], mx = Math.max.apply(null, s.map(function (x) { return x.balance; }).concat([f.target, 1]));
    var chart = s.length ? '<div class="coltarget"><div class="cols" style="position:relative">' + s.map(function (x) {
      return '<div class="colgrp"><span style="height:' + (x.balance / mx * 100) + '%;background:var(--future);width:min(46px,70%)" data-tip="' + esc(short(x.month) + ': ' + money(x.balance) + (x.moved ? ' (' + (x.moved > 0 ? '+' : '') + money(x.moved) + ' that month)' : '')) + '"></span></div>';
    }).join('') + '<div class="tline" style="bottom:' + (f.target / mx * 100) + '%"><span>Target ' + money(f.target) + '</span></div></div><div class="collabels">' + s.map(function (x) { return '<span>' + short(x.month) + '</span>'; }).join('') + '</div></div>' +
      '<p class="note">Balance at the end of each month, from your Money Log. It started at ' + money(f.starting_balance) + ' before these months.</p>' : '<p class="note">Log a deposit under your emergency fund category to see it grow.</p>';
    el.innerHTML = h + '<section class="grid2b">' + card('🛟 Progress', pct(share) + ' there', fundRing + prog) + card('📈 How it has grown', '', chart) + '</section>' +
      card('💡 Keep it working', '', '<p style="margin:0">Keep it somewhere safe and quick to reach, and only for real emergencies: job loss, illness, urgent repairs. School fees or a holiday are goals, not emergencies.</p><p class="note">Used some? Log it as “From my emergency fund” so your totals stay true.</p>');
  })();

  // ---------- Goals ----------
  (function () {
    var el = document.getElementById('view-goals'), g = VW.goals || [];
    var real = g.filter(function (x) { return x.target > 0; }), noTarget = g.filter(function (x) { return !(x.target > 0); });
    if (!real.length) { el.innerHTML = empty('No goals with a target yet.', 'On My Money Profile, give a target and a date to anything you’re saving for. It appears here with how much a month it needs.'); return; }
    var saved = real.reduce(function (a, x) { return a + (x.saved || 0); }, 0), aim = real.reduce(function (a, x) { return a + x.target; }, 0);
    var need = real.reduce(function (a, x) { return a + (x.per_month || 0); }, 0);
    var on = real.filter(function (x) { return /track|reach/i.test(x.status || ''); }).length;
    var h = tileRow([['Saved for goals', money(saved), 'of ' + money(aim), '💰'], ['Goals on track', on + ' of ' + real.length, 'Ladder step 6', '✅'], ['Needed each month', money(need), 'to hit every date', '📆'], ['Still to go', money(Math.max(0, aim - saved)), 'across all goals', '🏃']]);
    var GC = ['var(--future)', 'var(--needs)', 'var(--debt)', 'var(--gold)', 'var(--wants)'];
    function goalEmoji(n) { n = String(n || '').toLowerCase();
      return /car|vehicle|motor/.test(n) ? '🚗' : /house|home|land|plot|rent|deposit/.test(n) ? '🏠' : /school|fee|educat|college|uni/.test(n) ? '🎓' : /travel|holiday|trip|vacation/.test(n) ? '✈️' : /wedding|ruracio|dowry/.test(n) ? '💍' : /business|shop|stock/.test(n) ? '🏪' : /phone|laptop|computer/.test(n) ? '💻' : /baby|child|kid/.test(n) ? '👶' : /christmas|gift|december/.test(n) ? '🎁' : /health|medical|hospital/.test(n) ? '🩺' : '🎯'; }
    var cards = '<section class="goals">' + real.map(function (x, gi) {
      var sh = Math.min(1, (x.saved || 0) / x.target), st = (x.status || '').replace(/^[^A-Za-z]+/, '');
      var good = /track|reach/i.test(x.status || ''), col = good ? 'var(--good)' : 'var(--warn)';
      return '<article class="goal"><h3><span>' + goalEmoji(x.name) + ' ' + esc(x.name) + '</span></h3>' +
        '<div class="top">' + ring(sh, GC[gi % GC.length], pct(sh), 'saved', money(x.saved) + ' of ' + money(x.target)) +
        '<dl><dt>Saved</dt><dd>' + money(x.saved) + '</dd><dt>Target</dt><dd>' + money(x.target) + '</dd><dt>By</dt><dd>' + esc(x.date || '–') + '</dd><dt>A month</dt><dd>' + (x.per_month ? money(x.per_month) : '–') + '</dd></dl></div>' +
        (st ? '<span class="status"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + col + ';margin-right:6px"></i>' + (good ? '✓ ' : '! ') + esc(st) + '</span>' : '') + '</article>';
    }).join('') + '</section>';
    var other = noTarget.length ? card('🐷 Savings without a target', 'add one to track it', '<p style="margin:0">' + noTarget.map(function (x) { return esc(x.name); }).join(', ') + '.</p><p class="note">Give any of these a target and a date on My Money Profile to see if you’re on track.</p>') : '';
    el.innerHTML = h + cards + other;
  })();

  // ---------- My year ----------
  (function () {
    var el = document.getElementById('view-year'), y = VW.year;
    if (!y || !y.months.length) { el.innerHTML = empty('Nothing logged this year yet.', 'Log your money on the Money Log and your year builds up here.'); return; }
    var full = y.months.filter(function (m) { return m.complete && m['in']; });
    var avgRate = full.length ? full.reduce(function (a, m) { return a + (m.savings_rate || 0); }, 0) / full.length : null;
    var h = tileRow([['Money in', money(y.total_in), 'this year so far', '💰'], ['Money out', money(y.total_out), 'spending, savings and loans', '💸'], ['Saved', money(y.total_saved), avgRate == null ? '' : 'about ' + pct(avgRate) + ' of income, full months', '🌱'], ['Fees', money(y.fees), 'M-Pesa and bank charges', '🧾']]);
    var mx = Math.max.apply(null, y.months.map(function (m) { return Math.max(m['in'], m.out); }).concat([1]));
    var chart = '<div class="cols">' + y.months.map(function (m) {
      return '<div class="colgrp"><span style="height:' + (m['in'] / mx * 100) + '%;background:var(--future)" data-tip="' + esc(short(m.month) + ': money in ' + money(m['in'])) + '"></span><span style="height:' + (m.out / mx * 100) + '%;background:var(--needs)" data-tip="' + esc(short(m.month) + ': money out ' + money(m.out)) + '"></span></div>';
    }).join('') + '</div><div class="collabels">' + y.months.map(function (m) { return '<span>' + short(m.month) + (m.complete ? '' : '*') + '</span>'; }).join('') + '</div>' +
      '<div class="legend"><span><i class="sw" style="background:var(--future)"></i>Money in</span><span><i class="sw" style="background:var(--needs)"></i>Money out</span><span>* month in progress</span></div>' +
      '<details><summary>Show as a table</summary><table><thead><tr><th>Month</th><th>In</th><th>Out</th><th>Saved</th><th>Saved %</th></tr></thead><tbody>' + y.months.map(function (m) { return '<tr><td>' + short(m.month) + '</td><td>' + money(m['in']) + '</td><td>' + money(m.out) + '</td><td>' + money(m.saved) + '</td><td>' + pct(m.savings_rate) + '</td></tr>'; }).join('') + '</tbody></table></details>';
    var rate = '<div class="rows">' + full.map(function (m) { return '<div class="row"><span class="name">' + short(m.month) + '</span><div class="track" data-tip="' + esc(short(m.month) + ': saved ' + pct(m.savings_rate) + ' of income') + '"><span class="fill" style="width:' + Math.min(100, (m.savings_rate || 0) / 0.4 * 100) + '%;background:var(--future)"></span><span class="tick" style="left:calc(50% - 1px)"></span></div><span class="num">' + pct(m.savings_rate) + '</span></div>'; }).join('') + '</div><p class="note">The tick is the 20% guide. Full months only.</p>';
    var topCats = y.top_spending.slice(0, 5), restCats = y.top_spending.slice(5).reduce(function (a, c) { return a + c.total; }, 0);
    var CC = ['var(--future)', 'var(--gold)', 'var(--debt)', 'var(--needs)', 'var(--wants)'];
    var catSegs = topCats.map(function (c, i) { return { label: c.category, value: c.total, color: CC[i] }; });
    if (restCats > 0) catSegs.push({ label: 'Everything else', value: restCats, color: 'var(--ink-3)' });
    var catTot = catSegs.reduce(function (a, s) { return a + s.value; }, 0);
    catSegs.forEach(function (s) { s.tip = s.label + ': ' + money(s.value) + ' (' + pct(s.value / (catTot || 1)) + ')'; });
    var catBody = catSegs.length ? '<div class="donutwrap">' + donut(catSegs, money(catTot).replace(/^\S+ /, ''), 'spent', 'Spending by category this year') + dlegend(catSegs, catTot) + '</div>' : '<p class="note">Log some spending to see this.</p>';
    el.innerHTML = h + '<section class="grid2">' + card('📊 Money in and out', 'by month', chart) + card('🍩 Where most of it went', 'this year', catBody) + '</section>' +
      card('🌱 Share of income saved', 'by month', full.length ? rate : '<p class="note">Fills in once a month is finished.</p>');
  })();

  // ---------- Net worth ----------
  (function () {
    var el = document.getElementById('view-worth'), n = VW.net_worth;
    if (!n || !n.months.length) { el.innerHTML = empty('No net worth figures yet.', 'Type your balances on the Month-End Check and what you own on My Net Worth. It fills in month by month.'); return; }
    var last = n.months[n.months.length - 1];
    var h = tileRow([['Net worth', money(last.net), last.month + ': what you own minus what you owe', '🏡'], ['You own', money(last.own), '', '💎'], ['You owe', money(last.owe), '', '⛓️'], ['Change', (n.change_since_first >= 0 ? '+' : '') + money(n.change_since_first), 'since ' + (n.first_month_name || 'your first month'), n.change_since_first >= 0 ? '📈' : '📉']]);
    var W = 560, Hh = 200, pl = 70, pr = 16, pt = 14, pb = 26, vals = n.months.map(function (m) { return m.net; });
    var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max.apply(null, vals.concat([1]));
    var X = function (i) { return pl + (n.months.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n.months.length - 1)); };
    var Y = function (v) { return pt + (Hh - pt - pb) * (1 - (v - lo) / (hi - lo || 1)); };
    var ticks = [lo, (lo + hi) / 2, hi];
    var short_ = function (v) { var a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'k' : Math.round(a)); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" role="img" aria-label="Net worth by month">' +
      ticks.map(function (t) { return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--rule)" stroke-width="1"/><text x="' + (pl - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + short_(t) + '</text>'; }).join('') +
      '<path d="M' + n.months.map(function (m, i) { return X(i) + ' ' + Y(m.net); }).join(' L') + ' L' + X(n.months.length - 1) + ' ' + Y(lo) + ' L' + X(0) + ' ' + Y(lo) + 'Z" fill="var(--future)" opacity=".14"/>' +
      '<polyline points="' + n.months.map(function (m, i) { return X(i) + ',' + Y(m.net); }).join(' ') + '" fill="none" stroke="var(--future)" stroke-width="2.5"/>' +
      n.months.map(function (m, i) { return '<circle cx="' + X(i) + '" cy="' + Y(m.net) + '" r="5" fill="var(--future)" stroke="var(--bg)" stroke-width="2" data-tip="' + esc(m.month + ': ' + money(m.net) + ' (own ' + money(m.own) + ', owe ' + money(m.owe) + ')') + '"/><text x="' + X(i) + '" y="' + (Hh - 6) + '" text-anchor="middle">' + m.month + '</text>'; }).join('') + '</svg>';
    var OC = ['var(--future)', 'var(--gold)', 'var(--debt)', 'var(--needs)', 'var(--wants)'];
    var tsorted = (n.by_type || []).filter(function (t) { return t.value > 0; }).sort(function (a, b) { return b.value - a.value; });
    var ownSegs = tsorted.slice(0, 5).map(function (t, i) { return { label: t.type, value: t.value, color: OC[i] }; });
    var ownRest = tsorted.slice(5).reduce(function (a, t) { return a + t.value; }, 0);
    if (ownRest > 0) ownSegs.push({ label: 'Everything else', value: ownRest, color: 'var(--ink-3)' });
    var ownTot = ownSegs.reduce(function (a, s) { return a + s.value; }, 0);
    ownSegs.forEach(function (s) { s.tip = s.label + ': ' + money(s.value) + ' (' + pct(s.value / (ownTot || 1)) + ')'; });
    var ownBody = ownSegs.length ? '<div class="donutwrap">' + donut(ownSegs, short_(ownTot), 'you own', 'What you own by type') + dlegend(ownSegs, ownTot) + '</div>' : '<p class="note">Type what you own on My Net Worth.</p>';
    el.innerHTML = h + '<section class="grid2">' + card('📈 Net worth', 'by month', svg + '<p class="note">From My Net Worth. A big jump usually means a new asset was typed in, not that it grew overnight.</p>') +
      card('💎 What you own', 'latest month', ownBody) + '</section>';
  })();

  // ---------- My future ----------
  (function () {
    var el = document.getElementById('view-future'), f = VW.future || {};
    var v = { age: f.age, stop: f.stop_age || 60, want: f.income_wanted, saved: f.saved || 0, monthly: f.monthly || 0 };
    var ret = f['return'] || 0.10, inf = f.inflation || 0.05, spend = f.spend_rate || 0.04;
    var form = '<div class="fields">' + [['fa', 'My age now', v.age], ['fs', 'Age I want to stop working', v.stop], ['fw', 'Monthly income I’d want (today’s money)', v.want], ['fp', 'Saved for this today', v.saved], ['fm', 'I add every month', v.monthly]].map(function (x) {
      return '<label for="' + x[0] + '">' + esc(x[1]) + '<input id="' + x[0] + '" type="number" inputmode="numeric" min="0" step="1" value="' + (x[2] == null ? '' : Math.round(x[2])) + '"></label>';
    }).join('') + '</div><p class="note">Filled from My Future. Change them here to explore; your planner doesn’t change. Assumes ' + pct(ret) + ' a year returns, ' + pct(inf) + ' inflation and spending ' + pct(spend) + ' of the pot a year. An estimate, not a promise.</p>';
    el.innerHTML = '<section class="tiles" id="ft"></section><section class="grid2b">' + card('🙋 About me', 'type to explore', form) + card('🎯 To hit my target', '', '<div id="fn"></div>') + '</section>';
    function num(id) { var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? null : x; }
    function draw() {
      var age = num('fa'), stop = num('fs'), want = num('fw'), saved = num('fp') || 0, monthly = num('fm') || 0;
      if (age == null || stop == null || stop <= age) { document.getElementById('ft').innerHTML = tile('Years to go', '–', 'type your age', '⏳') + tile('Pot then', '–', 'today’s money', '🏺') + tile('It could pay', '–', 'a month', '💵') + tile('Of what you want', '–', '', '🎯'); document.getElementById('fn').innerHTML = '<p class="note">Type your age (and an age to stop that’s later) to see your future. This is Ladder step 7.</p>'; return; }
      var n = stop - age, r = (1 + ret) / (1 + inf) - 1, rm = r / 12, k = n * 12, g = Math.pow(1 + rm, k);
      var pot = saved * g + (rm ? monthly * (g - 1) / rm : monthly * k), pays = pot * spend / 12;
      var share = want ? pays / want : null, potNeed = want ? want * 12 / spend : null;
      var needM = potNeed == null ? null : Math.max(0, (potNeed - saved * g) * (rm ? rm / (g - 1) : 1 / k));
      document.getElementById('ft').innerHTML = tile('Years to go', n, 'until you’re ' + stop, '⏳') + tile('Pot then', money(pot), 'in today’s money', '🏺') + tile('It could pay', money(pays), 'a month, in today’s money', '💵') + tile('Of what you want', share == null ? '–' : pct(share), want ? 'of ' + money(want) + ' a month' : 'type the income you’d want', '🎯');
      document.getElementById('fn').innerHTML = want ? '<table><tbody><tr><td>Pot you’d need (today’s money)</td><td><b>' + money(potNeed) + '</b></td></tr><tr><td>To add each month</td><td><b>' + money(needM) + '</b></td></tr><tr><td>Extra on top of now</td><td class="' + (needM > monthly ? '' : 'better') + '"><b>' + (needM > monthly ? money(needM - monthly) : 'nothing: you’re on track') + '</b></td></tr></tbody></table><p class="note">Raise your monthly amount as your income grows and you get there sooner.</p>' : '<p class="note">Type the monthly income you’d want to see what it takes.</p>';
    }
    el.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', draw); });
    draw();
  })();

  // ---------- tabs (hash routing) ----------
  var VIEWS = ['money', 'debt', 'fund', 'goals', 'year', 'worth', 'future'];
  function route() {
    var h = (location.hash || '#money').slice(1); if (VIEWS.indexOf(h) < 0) h = 'money';
    VIEWS.forEach(function (v) { document.getElementById('view-' + v).hidden = v !== h; });
    document.querySelectorAll('#tabs a').forEach(function (a) { if (a.getAttribute('href') === '#' + h) { a.setAttribute('aria-current', 'page'); var t = document.getElementById('tabs'); t.scrollLeft = a.offsetLeft - (t.clientWidth - a.offsetWidth) / 2; } else a.removeAttribute('aria-current'); });
    var month = document.querySelectorAll('#chips .chip');
    if (month[2]) month[2].hidden = h !== 'money';
  }
  window.addEventListener('hashchange', route); route();

  // footer
  document.getElementById('foot').innerHTML = '<span>From your Fnsoko Money Planner. A snapshot: your planner stays your record.</span><span>Not financial advice. Check the numbers against your planner.</span>';

  // hover tooltips
  var tip = document.getElementById('tip');
  function show(e) { var t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; } tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    var x = (e.clientX || t.getBoundingClientRect().left) + 12, y = (e.clientY || t.getBoundingClientRect().top) + 14;
    tip.style.left = Math.min(x, window.innerWidth - 250) + 'px'; tip.style.top = y + 'px'; }
  app.addEventListener('pointermove', show); app.addEventListener('pointerleave', function () { tip.hidden = true; });
  app.addEventListener('focusin', show); app.addEventListener('focusout', function () { tip.hidden = true; });
})();
</script>
